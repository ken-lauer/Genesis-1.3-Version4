name: Documentation

on:
  pull_request:
  push:
  release:
    types:
      - published

permissions:
  id-token: write
  contents: write
  pull-requests: write
  actions: read

jobs:
  wasm:
    runs-on: ubuntu-latest
    name: "Build WebAssembly demo"
    steps:
      - uses: actions/checkout@v4
      - name: Cache HDF5 and FFTW for wasm
        uses: actions/cache@v4
        with:
          path: |
            wasm/build/hdf5
            wasm/build/fftw
            wasm/build/fftw-src
          key: wasm-deps-${{ hashFiles('wasm/build.sh') }}
      - name: Build
        env:
          G4_REPO_URL: ${{ github.server_url }}/${{ github.repository }}
        run: ./wasm/build.sh
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Test
        run: |
          node --test wasm/test/deck.test.mjs
          node wasm/test/run-example1.mjs 2>&1 | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Upload demo artifact
        uses: actions/upload-artifact@v4
        with:
          name: genesis4-wasm-demo
          path: wasm/build/demo

  build:
    runs-on: ubuntu-latest
    name: "Build docs"
    needs: wasm
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up the documentation destination
        run: |
          mkdir site/
      - name: Add the WebAssembly demo
        uses: actions/download-artifact@v4
        with:
          name: genesis4-wasm-demo
          path: site/demo
      - uses: docker://pandoc/core:2.9
        with:
          args: >-
            --standalone
            --include-before-body=wasm/demo/docs-banner.html
            --output=site/index.html
            manual/MANUAL.md
            manual/INSTALLATION.md
            manual/MAIN_INPUT.md
            manual/LATTICE.md
            manual/XGENESIS.md
      - uses: docker://pandoc/latex:2.9
        with:
          args: >-
            --standalone
            --output=genesis4.pdf
            manual/MANUAL.md
            manual/INSTALLATION.md
            manual/MAIN_INPUT.md
            manual/LATTICE.md
            manual/XGENESIS.md
            -V 'mainfont:SansSerif.ttf' 
            -V geometry:margin=1in 
            -V colorlinks=true 
            -V linkcolor=blue 
            -V urlcolor=red 
            -V toccolor=gray
            -s
      - name: Upload PDF artifact
        uses: actions/upload-artifact@v4
        with:
          name: genesis4.pdf
          path: genesis4.pdf
      - name: Upload docs artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./site
  deploy:
    # ken-lauer/wasm-spike: temporary, to test the WebAssembly demo on a fork
    if: >-
      ${{ (github.repository_owner == 'svenreiche' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master' || startsWith(github.ref, 'refs/tags')))
      || (github.repository_owner == 'ken-lauer' && github.ref == 'refs/heads/wasm-spike' && github.event_name == 'push') }}
    needs: build
    name: "Deploy docs"

    # Grant GITHUB_TOKEN the permissions required to make a Pages deployment
    permissions:
      pages: write      # to deploy to Pages
      id-token: write   # to verify the deployment originates from an appropriate source

    # Deploy to the github-pages environment
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    # Specify runner + deployment step
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
