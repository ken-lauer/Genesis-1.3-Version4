name: Genesis4 - Build & Test

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build-system:
    name: system-${{ matrix.os }}-${{ matrix.mpi }}
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        mpi: [openmpi, mpich]

    steps:
      - uses: actions/checkout@v4

      - name: Install system dependencies (Ubuntu) - OpenMPI
        if: runner.os == 'Linux' && matrix.mpi == 'openmpi'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            cmake \
            gfortran \
            libfftw3-dev \
            libhdf5-dev \
            libopenmpi-dev \
            openmpi-bin
      
      - name: Install system dependencies (Ubuntu) - MPICH
        if: runner.os == 'Linux' && matrix.mpi == 'mpich'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            cmake \
            gfortran \
            libfftw3-dev \
            libhdf5-dev \
            libmpich-dev \
            mpich

      - name: Install system dependencies (macOS)
        if: runner.os == 'macOS'
        run: |
          brew update
          brew install \
            cmake \
            gcc \
            fftw \
            hdf5 \
            ${{ matrix.mpi }}

      - name: Setup MPI environment
        run: |
          which mpicc
          which mpicxx
          mpicc --version
          mpicxx --version

      - name: Build Genesis4
        env:
          MPI: ${{ matrix.mpi }}
        run: |
          set -xe

          cmake -S . -B build \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_CXX_FLAGS="-Wall -Wextra $CMAKE_CXX_FLAGS"
          
          make -j -C build
          
          ls -la build/genesis4

      - name: Run tests
        run: |
          .github/scripts/run_tests.sh 2>&1 | tee -a "$GITHUB_STEP_SUMMARY"
